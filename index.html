<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#16191c;--mute:#686e74;--line:#dcdad3;--red:#d1261b;--org:#ec7a00;--blue:#1d6fd6;--ok:#14a44d;--shadow:0 6px 24px rgba(0,0,0,.16);--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Heebo,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
header{display:flex;gap:10px;align-items:center;padding:calc(var(--st) + 8px) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
header h1{font-size:17px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:24px;height:24px}
.search{flex:0 0 100px;display:flex;margin-inline-start:auto}
#mapv header h1{flex:1}
.search input{width:100%;font:16px Heebo,sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
/* home */
#home main{flex:1;overflow:auto;padding:16px 14px calc(var(--sb) + 20px)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:700 17px Heebo;cursor:pointer}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;display:flex;gap:12px;align-items:center;cursor:pointer}
.proj b{font-size:18px;display:block}.proj span{font-size:13px;color:var(--mute)}
.proj .x{margin-inline-start:auto;font-size:13px;color:var(--mute);border:1px solid var(--line);background:none;border-radius:10px;padding:8px 10px;cursor:pointer;flex:none}
.proj .x.arm{background:var(--red);color:#fff;border-color:var(--red)}
.hint{font-size:13px;color:var(--mute);margin:14px 2px 0}
#imp{margin-top:12px;font-size:14px;color:var(--blue);min-height:20px}
/* map */
#wrap{position:relative;flex:1}
#map,#lbl{position:absolute;inset:0}
#lbl{pointer-events:none;z-index:2;width:100%;height:100%}
#cross{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:3;pointer-events:none;transition:transform .12s}
#cross.snap{transform:scale(1.18)}
.side{position:absolute;right:10px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:4}
.side button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;position:relative}
.side button svg{width:22px;height:22px}
.side button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.side button.half{color:var(--blue)}
.badge{position:absolute;top:-6px;left:-6px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.badge[hidden]{display:none}
#layers{position:absolute;right:66px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px 4px;z-index:4;display:none;width:230px}
#layers.open{display:block}
#layers label{display:flex;gap:10px;align-items:center;padding:9px 10px;font-size:15px;cursor:pointer}
#layers input{width:20px;height:20px;accent-color:var(--blue)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
#card{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 10px);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;z-index:4;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;max-width:560px;margin:0 auto}
#kind{font-size:13px;font-weight:700;color:var(--mute)}
#title{font-size:21px;font-weight:800;line-height:1.15}
#coord{font-size:13px;color:var(--mute);direction:ltr;text-align:right;white-space:nowrap}
#pick{grid-column:2;height:58px;padding:0 18px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:700 17px Heebo;cursor:pointer;display:flex;align-items:center;gap:8px}
#pick svg{width:22px;height:22px}
#info{grid-column:1}
#modes{grid-column:1/3;display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;margin-bottom:4px}
#modes button{flex:1;min-height:38px;border:0;background:none;border-radius:9px;font:700 15px Heebo;color:var(--mute);cursor:pointer}
#modes button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
#selRow{grid-column:1/3;display:flex}
#selBtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;min-height:40px;font:700 15px Heebo;cursor:pointer}
#selBtn i{width:12px;height:12px;border-radius:50%}
#lineBar{grid-column:1/3;display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:6px 8px}
#lineBar .lbb{display:flex;gap:8px;align-items:center}#lineBar .lbb span{flex:1;font-weight:700;font-size:14px}
#olines{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -8px;padding:0 8px}#olines::-webkit-scrollbar{display:none}
#olines button{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font:700 14px Heebo;cursor:pointer;white-space:nowrap}
#olines button i{width:10px;height:10px;border-radius:50%}
#olines button.on{color:#fff}#olines .add{border-style:dashed;color:var(--ink)}
#lineBar button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font:700 14px Heebo;cursor:pointer}
#lineBar .fin{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpd{font:800 42px Heebo;text-align:center;direction:ltr;padding:4px 0 10px}
#kpKeys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#kpKeys button{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font:700 24px Heebo;cursor:pointer}
.prow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line)}
.prow b{flex:1;font-size:15px}.prow button{min-height:42px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px;font:600 14px Heebo;cursor:pointer;white-space:nowrap}
#chips{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap}
#chips:empty{display:none}
#chips button{font:600 14px Heebo;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
#chips button.cur{border-color:var(--red);color:var(--red)}
/* sheets */
.sheet{position:fixed;inset:auto 0 0 0;max-height:88%;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.2);z-index:20;transform:translateY(105%);transition:transform .22s;display:flex;flex-direction:column;padding-bottom:var(--sb)}
.sheet.open{transform:none}
.sheet h2{font-size:19px;margin:0;padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2 button{border:0;background:none;color:var(--mute);font:600 15px Heebo;min-height:44px;cursor:pointer;flex:none}
.sub{font-size:13px;color:var(--mute);padding:0 16px;direction:rtl}
.sub .ltr{direction:ltr;unicode-bidi:isolate}
.sbody{overflow:auto;padding:10px 12px 14px}
.inf{display:flex;gap:6px;flex-wrap:wrap}
.inf button{font:600 15px Heebo;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;min-height:42px;cursor:pointer;display:flex;align-items:center;gap:6px}
.inf button i{width:10px;height:10px;border-radius:50%;display:block}
.inf button.on{color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.grid figure{margin:0;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#ddd;cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.hd{position:absolute;bottom:5px;left:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.hd.ok{background:var(--ok)}
.hd svg{width:16px;height:16px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font:700 16px Heebo;cursor:pointer}
.acts .pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts .dng.arm{background:var(--red);color:#fff;border-color:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.row img,.row .ph{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#e7e5df;flex:none}
.row b{display:block}.row span{font-size:13px;color:var(--mute)}
.empty{padding:18px 8px;color:var(--mute)}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19;display:none}
#veil.on{display:block}
/* camera */
#cam{background:#000;color:#fff;z-index:30}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camTop{position:absolute;top:0;left:0;right:0;padding:calc(var(--st) + 8px) 10px 10px;background:linear-gradient(rgba(0,0,0,.65),transparent);display:flex;flex-direction:column;gap:8px;z-index:2}
#camTop .t{display:flex;align-items:center;gap:8px;font-weight:700}
#camTop .t span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#camTop .ib{color:#fff}
#camInf{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:0 10px}#camInf::-webkit-scrollbar{display:none}#cam .inf button{flex:none;white-space:nowrap;background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.35);color:#fff;min-height:38px;padding:5px 11px;font-size:14px}
#compass{position:absolute;left:50%;top:50%;width:min(64vw,280px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:1;pointer-events:none}
#cstat{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 150px);background:rgba(0,0,0,.6);padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;z-index:2;white-space:nowrap}
#cstat.ok{background:var(--ok)}
#camBot{position:absolute;bottom:0;left:0;right:0;padding:12px 14px calc(var(--sb) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.7));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;z-index:2}
#strip{display:flex;gap:6px;overflow:hidden}
#strip img{width:46px;height:46px;border-radius:8px;object-fit:cover;border:2px solid #fff}
#shoot{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;transition:background .15s}
#shoot.ok{background:var(--ok)}
#shoot:active{transform:scale(.94)}
#done{justify-self:start;min-height:50px;padding:0 20px;border-radius:14px;border:0;background:#fff;color:#000;font:800 17px Heebo;cursor:pointer}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3;transition:opacity .25s}
#camErr{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:1}
#camErr.on{display:grid}
.lnk{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:12px;padding:10px 14px;font:600 15px Heebo;cursor:pointer;margin-top:10px}
#native{display:none}
/* viewer */
#viewer{background:#000;color:#fff;z-index:40}
#viewer img{flex:1;width:100%;object-fit:contain;min-height:0}
#viewer .vbar{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 6px) 10px 8px}
#viewer .vbar span{flex:1;font-size:14px}
#viewer .vbar .ib{color:#fff}
#vdel{border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:10px;padding:8px 12px;font:600 14px Heebo;cursor:pointer}
#vdel.arm{background:var(--red);border-color:var(--red)}
#bSync{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;position:relative;color:var(--mute)}
#bSync svg{width:26px;height:26px}#bSync.ok{color:var(--ok)}#bSync.wait{color:var(--org)}#bSync.busy{color:var(--blue)}#bSync.busy svg{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.35}}
.dbx{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.dbx b{font-size:17px}.dbx>span{font-size:14px;color:var(--mute)}
.dbx input{width:100%;font:16px Heebo,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);direction:ltr}
.dbx .row2{display:flex;gap:8px}.dbx .row2 button,.dbx .b2{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font:700 15px Heebo;cursor:pointer}
.dbx .pri{background:#0061FE;color:#fff;border-color:#0061FE}
.dbx .lk{background:none;border:0;color:var(--blue);font:500 14px Heebo;text-align:start;padding:4px 0;cursor:pointer}
.dbx .arm{background:var(--red)!important;color:#fff!important}
[hidden]{display:none!important}
.brw{background:#fff4d6;color:#6b4a00;border-bottom:1px solid #f0d58a;padding:8px 12px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;z-index:5}
.brw span{flex:1}.brw button{border:0;background:none;font-size:20px;color:#6b4a00;width:36px;height:36px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(var(--st) + 70px);transform:translate(-50%,-10px);opacity:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:15px;z-index:60;transition:.2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.maplibregl-ctrl-scale{font:12px Heebo;background:rgba(255,255,255,.85)!important}
.maplibregl-ctrl-bottom-left{bottom:calc(var(--sb) + 200px)}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen" id="home">
  <header><h1>שוחות<small>תיעוד שוחות על גבי מדידה</small></h1></header>
  <main>
    <label class="big" for="dwgIn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>טעינת מדידה (DWG)</label>
    <input type="file" id="dwgIn" accept=".dwg,application/acad,application/octet-stream" hidden>
    <div id="imp"></div>
    <div id="plist"></div>
    <div class="dbx"><b>דרופבוקס</b><span id="dbxStat"></span>
      <div id="dbxSetup" style="display:flex;flex-direction:column;gap:8px">
        <input id="dbxKey" placeholder="App key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="App key של דרופבוקס">
        <button class="b2 pri" id="dbxGo">התחבר לדרופבוקס</button>
        <button class="lk" id="dbxPaste">החיבור לא חזר לאפליקציה? התחברות עם קוד</button>
        <div id="dbxCodeBox" class="row2" hidden><input id="dbxCode" placeholder="הדבק את הקוד מדרופבוקס"><button class="b2" id="dbxCodeGo" style="flex:0 0 80px">אשר</button></div>
      </div>
      <div id="dbxOn" class="row2" hidden><button id="dbxNow">סנכרן עכשיו</button><button id="dbxOff">נתק</button></div>
    </div>
    <p class="hint" id="store"></p>
  </main>
</section>

<!-- MAP -->
<section class="screen" id="mapv">
  <header>
    <button class="ib" id="back" aria-label="פרויקטים"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <h1 id="pname">—<small id="pinfo"></small></h1>
    <button id="bSync" class="off" aria-label="גיבוי לדרופבוקס"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18h10.5a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"/></svg><span class="badge" id="sBadge" hidden>0</span></button>
    <form class="search" id="sf"><input id="q" inputmode="numeric" placeholder="מס׳ נקודה" aria-label="חיפוש לפי מספר נקודה"></form>
  </header>
  <div id="wrap">
    <div id="map"></div>
    <canvas id="lbl"></canvas>
    <svg id="cross" viewBox="0 0 46 46" aria-hidden="true"><g fill="none" stroke-linecap="round"><g stroke="#fff" stroke-width="5"><path d="M23 2v13M23 31v13M2 23h13M31 23h13"/><circle cx="23" cy="23" r="9"/></g><g id="cg" stroke="#16191c" stroke-width="2.2"><path d="M23 2v13M23 31v13M2 23h13M31 23h13"/><circle cx="23" cy="23" r="9"/></g></g></svg>
    <div class="side">
      <button id="bGps" aria-label="המיקום שלי"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-linecap="round"/></svg></button>
      <button id="bFit" aria-label="כל הפרויקט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="bLay" aria-label="שכבות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
      <button id="bList" aria-label="שוחות שתועדו"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg><span class="badge" id="cnt" hidden>0</span></button>
    </div>
    <div id="layers">
      <label><input type="checkbox" data-k="snap" id="snapCb" checked><span class="dot" style="border:2px dashed var(--ink)"></span>הצמדה לשוחות</label>
      <label><input type="checkbox" data-k="mh" checked><span class="dot" style="border:3px solid var(--red)"></span>שוחות מדודות</label>
      <label><input type="checkbox" data-k="mhtxt" checked><span class="dot" style="border:3px solid var(--org)"></span>שוחות מכיתוב בלבד</label>
      <label><input type="checkbox" data-k="rec" checked><span class="dot" style="background:#A16207"></span>שוחות שתיעדתי</label>
      <label><input type="checkbox" data-k="sp" checked><span class="dot" style="background:#7c8a99"></span>תמרורים ועמודי תאורה</label>
      <label><input type="checkbox" data-k="h"><span class="dot" style="background:#b4b0a6"></span>נקודות גובה</label>
      <label><input type="checkbox" data-k="lbl" checked><span class="dot" style="border:2px solid var(--mute)"></span>כיתובים</label>
    </div>
    <div id="card">
      <div id="modes"><button data-m="mh">שוחה</button><button data-m="el">אלמנט</button><button data-m="line">קו</button><button data-m="flow">זרימה</button></div>
      <div id="selRow" hidden><button id="selBtn"></button></div>
      <div id="lineBar" hidden><div id="olines"></div><div class="lbb"><span id="lbT"></span><button id="lbUndo">בטל נקודה</button><button class="fin" id="lbFin">סיים קו</button></div></div>
      <div id="info"><div id="kind">מיקום חופשי</div><div id="title">—</div><div id="coord"></div></div>
      <button id="pick"><svg id="pickI" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="pickT">צלם</span></button>
      <div id="chips"></div>
    </div>
  </div>
</section>

<!-- CAMERA -->
<section class="screen" id="cam">
  <video id="video" playsinline muted autoplay></video>
  <svg id="compass" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
    <path d="M100 4v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <g id="needle"><path d="M100 14l12 26h-24z" fill="#ff3b30"/><text x="100" y="58" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" font-family="Heebo,sans-serif">N</text></g>
    <path d="M90 100h20M100 90v20" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
  </svg>
  <div id="camTop">
    <div class="t"><button class="ib" id="camX" aria-label="סגור"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span id="camName"></span></div>
    <div class="inf" id="camInf"></div>
  </div>
  <div id="camErr"><div><div id="camErrT">אין גישה למצלמה</div><button class="lnk" id="useNat">פתח את מצלמת האייפון</button></div></div>
  <div id="cstat">מצפן לא זמין</div>
  <div id="camBot"><div id="strip"></div><button id="shoot" aria-label="צלם"></button><button id="done">סיום</button></div>
  <div id="flash"></div>
  <input type="file" id="native" accept="image/*" capture="environment">
</section>

<!-- VIEWER -->
<section class="screen" id="viewer">
  <div class="vbar"><button class="ib" id="vX" aria-label="סגור"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span id="vInfo"></span><button id="vdel">מחק תמונה</button></div>
  <img id="vImg" alt="">
</section>

<div id="veil"></div>

  if(r&&recs.has(r.id))toast(`נשמר: ${r.name} · ${r.n||0} תמונות`);camRec=null;update()}
$('#done').onclick=finishCam;$('#camX').onclick=finishCam;

/* ---------- record sheet ---------- */
let openR=null,urls=[];
function sheet(id,on){$('#'+id).classList.toggle('open',on);$('#veil').classList.toggle('on',!!document.querySelector('.sheet.open'))}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>sheet(b.closest('.sheet').id,false));
$('#veil').onclick=()=>document.querySelectorAll('.sheet.open').forEach(s=>sheet(s.id,false));
const arrow=(hd,ok)=>hd==null?'':`<span class="hd ${ok?'ok':''}"><svg viewBox="0 0 16 16" style="transform:rotate(${hd}deg)"><path d="M8 2l4 10-4-2-4 2z" fill="#fff"/></svg></span>`;
function lineLen(r){let s=0;for(let i=1;i<r.pts.length;i++)s+=Math.hypot(r.pts[i].xy[0]-r.pts[i-1].xy[0],r.pts[i].xy[1]-r.pts[i-1].xy[1]);return s}
async function openRec(r){openR=r;urls.forEach(URL.revokeObjectURL);urls=[];$('#rName').textContent=r.name;const t=typ(r);
  const when=new Date(r.created).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'});
  $('#rSub').innerHTML=t==='line'?`${when} · ${r.pts.length} נקודות · ${lineLen(r).toFixed(1)} מ׳`:t==='flow'?`${when} · ${Math.hypot(r.b.xy[0]-r.a.xy[0],r.b.xy[1]-r.a.xy[1]).toFixed(1)} מ׳`:`${when} · <span class="ltr">${fmt(r.xy)}</span>`+(t==='el'&&r.on?` · על ${esc(r.on)}`:'');
  $('#rInf').hidden=t!=='mh';$('#rGrid').hidden=t==='line'||t==='flow';$('#rMore').hidden=t==='line'||t==='flow';$('#rMore').textContent=t==='el'?'צלם':'צלם עוד';$('#rCont').hidden=t!=='line';$('#rRev').hidden=t!=='flow';
  $('#rExtra').innerHTML=t==='line'?r.pts.map((p,i)=>`<div class="prow"><b>${i+1}. ${esc(p.on||'נקודה')}${p.ref&&p.ref.line?' · הסתעפות':''}</b><button data-dep="${i}">${p.d!=null?Number(p.d).toFixed(2)+' מ׳':'+ עומק'}</button><button data-x="${i}" aria-label="מחק נקודה">✕</button></div>`).join('')
    :t==='flow'?`<div class="prow"><b>מוצא: ${esc(r.a.name)}</b></div><div class="prow"><b>יעד: ${esc(r.b.name)}</b></div>`:'';
  byIdx('photos','rid',r.id).then(a=>{const up=a.filter(x=>x.up).length;if(a.length&&openR===r)$('#rSub').insertAdjacentHTML('beforeend',` · ${up===a.length?'☁ ✓ בדרופבוקס':`☁ ${up}/${a.length} בדרופבוקס`}`)});
  $('#rInf').innerHTML=infBtns(r.infra);const ph=(await byIdx('photos','rid',r.id)).sort((a,b)=>a.ts-b.ts);
  $('#rGrid').innerHTML=ph.length?ph.map(p=>{const u=URL.createObjectURL(p.thumb);urls.push(u);return`<figure data-id="${p.id}"><img src="${u}" alt="">${arrow(p.hd,p.north)}</figure>`}).join(''):'<div class="empty">אין תמונות</div>';
  $('#rDel').classList.remove('arm');$('#rDel').textContent='מחק '+TYPEN[t];sheet('listS',false);sheet('recS',true)}
$('#rExtra').addEventListener('click',async e=>{const d=e.target.closest('[data-dep]'),x=e.target.closest('[data-x]');if(d)return askDepth(openR,+d.dataset.dep);
  if(x){if(openR.pts.length<=2)return toast('בקו חייבות להיות 2 נקודות – אפשר למחוק את כל הקו');openR.pts.splice(+x.dataset.x,1);openR.xy=openR.pts[0].xy;openR.ll=openR.pts[0].ll;await saveRec(openR);openRec(openR)}});
$('#rCont').onclick=async()=>{const r=openR;sheet('recS',false);if(mode!=='line')await setMode('line');dropEmpty();r.open=true;await saveRec(r);setActive(r);map.flyTo({center:r.pts[r.pts.length-1].ll,zoom:Math.max(map.getZoom(),20)});update();toast('המשך את הקו מהנקודה האחרונה')};
$('#rRev').onclick=async()=>{const r=openR;[r.a,r.b]=[r.b,r.a];r.xy=r.a.xy;r.ll=r.a.ll;r.name=`זרימת ${IC[r.infra][1]}: ${r.a.name} אל ${r.b.name}`;await saveRec(r);openRec(r)};
$('#rInf').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;openR.infra=openR.infra===b.dataset.k?null:b.dataset.k;if(openR.infra)LS.set('lastInf',openR.infra);$('#rInf').innerHTML=infBtns(openR.infra);await saveRec(openR)});
$('#rMore').onclick=()=>{requestCompass();sheet('recS',false);openCam(openR)};
$('#rDel').onclick=()=>arm($('#rDel'),'לחץ שוב למחיקה',async()=>{for(const p of await byIdx('photos','rid',openR.id)){dbxDel(p.path);await del('queue',p.id);await del('photos',p.id)}await del('records',openR.id);markDirty(openR.pid);recs.delete(openR.id);if(activeLine===openR){const ol=openLines();setActive(ol[ol.length-1])}sheet('recS',false);drawRecs();cur=null;update();toast('נמחק')});
let vPh=null,vUrl;
$('#rGrid').addEventListener('click',async e=>{const f=e.target.closest('figure');if(!f)return;vPh=await get('photos',f.dataset.id);if(vUrl)URL.revokeObjectURL(vUrl);vUrl=URL.createObjectURL(vPh.blob||vPh.thumb);$('#vImg').src=vUrl;
  if(!vPh.blob&&vPh.path){const want=vPh.id;dbxRpc('files/get_temporary_link',{path:vPh.path}).then(j=>{if(vPh&&vPh.id===want)$('#vImg').src=j.link}).catch(()=>toast('צריך אינטרנט כדי לראות את התמונה המלאה'))}
  $('#vInfo').textContent=new Date(vPh.ts).toLocaleTimeString('he-IL',{timeStyle:'short'})+(vPh.hd!=null?` · כיוון ${vPh.hd}°${vPh.north?' (צפון ✓)':''}`:'');$('#vdel').classList.remove('arm');$('#vdel').textContent='מחק תמונה';screen('viewer')});
$('#vX').onclick=()=>{screen('mapv');map.resize()};
$('#vdel').onclick=()=>arm($('#vdel'),'בטוח?',async()=>{dbxDel(vPh.path);await del('queue',vPh.id);await del('photos',vPh.id);openR.n=Math.max(0,(openR.n||1)-1);const rest=await byIdx('photos','rid',openR.id);rest.sort((a,b)=>a.ts-b.ts);openR.cover=rest[0]?rest[0].thumb:null;await saveRec(openR);screen('mapv');openRec(openR)});
// list
$('#bList').onclick=()=>{const rs=[...recs.values()].sort((a,b)=>(b.updated||0)-(a.updated||0));urls.forEach(URL.revokeObjectURL);urls=[];
  $('#lBody').innerHTML=rs.length?rs.map(r=>{const t=typ(r);let im=`<span class="ph" style="${t!=='mh'?`background:${colOf(r)};opacity:.85`:''}"></span>`;if(r.cover){const u=URL.createObjectURL(r.cover);urls.push(u);im=`<img src="${u}" alt="">`}
    const info=t==='line'?`${r.open?'פתוח · ':''}${r.pts.length} נק׳ · ${lineLen(r).toFixed(0)} מ׳`:t==='flow'?'כיוון זרימה':`${r.n||0} תמונות`;
    return`<div class="row" data-id="${r.id}">${im}<div><b>${esc(r.name)}</b><span>${TYPEN[t]}${r.infra&&t==='mh'?' · '+IC[r.infra][1]:''} · ${info} · ${new Date(r.updated||r.created).toLocaleTimeString('he-IL',{timeStyle:'short'})}</span></div></div>`}).join(''):'<div class="empty">עוד לא תועד כלום בפרויקט הזה.</div>';sheet('listS',true)};
$('#lBody').addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;const rc=recs.get(r.dataset.id);follow=false;gpsBtn();map.flyTo({center:rc.ll,zoom:21.5});openRec(rc)});

/* ---------- Dropbox ---------- */
const REDIR=location.origin+location.pathname.replace(/index\.html$/,'');
const DBX={key:()=>LS.get('dbxKey')||'',refresh:()=>LS.get('dbxRefresh')||''};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const hdr=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));
async function dbxAuthUrl(withRedirect){const v=b64u(crypto.getRandomValues(new Uint8Array(48)));LS.set('dbxVer',v);const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  const q={client_id:DBX.key(),response_type:'code',code_challenge:ch,code_challenge_method:'S256',token_access_type:'offline'};if(withRedirect)q.redirect_uri=REDIR;
  return'https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams(q)}
function saveTok(j){if(j.refresh_token)LS.set('dbxRefresh',j.refresh_token);LS.set('dbxAccess',j.access_token);LS.set('dbxExp',String(Date.now()+(j.expires_in||14400)*1000))}
async function dbxExchange(code,withRedirect){const q={code:code.trim(),grant_type:'authorization_code',code_verifier:LS.get('dbxVer')||'',client_id:DBX.key()};if(withRedirect)q.redirect_uri=REDIR;
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams(q)});const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.refresh_token)throw new Error(j.error_description||j.error||'החיבור נכשל');saveTok(j);LS.set('dbxVer','')}
async function dbxToken(force){if(!DBX.refresh())throw new Error('nolink');if(!force&&+LS.get('dbxExp')>Date.now()+60000)return LS.get('dbxAccess');
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:DBX.refresh(),client_id:DBX.key()})});const j=await r.json().catch(()=>({}));
  if(!r.ok){if(j.error==='invalid_grant'){LS.set('dbxRefresh','');syncUi()}throw new Error(j.error||'token')}saveTok(j);return j.access_token}
async function dbxCall(url,opts,retry=true){const t=await dbxToken();const r=await fetch(url,{...opts,headers:{...opts.headers,Authorization:'Bearer '+t}});
  if(r.status===401&&retry){await dbxToken(true);return dbxCall(url,opts,false)}if(!r.ok){const e=new Error(await r.text());e.status=r.status;throw e}return r.json()}
const dbxUpload=(path,blob)=>dbxCall('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Dropbox-API-Arg':hdr({path,mode:'add',autorename:true,mute:true}),'Content-Type':'application/octet-stream'},body:blob});
const dbxPut=(path,blob)=>dbxCall('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Dropbox-API-Arg':hdr({path,mode:'overwrite',mute:true}),'Content-Type':'application/octet-stream'},body:blob});
const dbxRpc=(ep,arg)=>dbxCall('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(arg)});
async function dbxDel(path){if(!path||!DBX.refresh())return;try{await dbxRpc('files/delete_v2',{path})}catch(e){}}
const safe=s=>String(s).replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim();
async function projFolder(p){if(!p.folder){p.folder='/'+safe(p.name);await put('projects',p)}return p.folder}
const dirty=new Set((()=>{try{return JSON.parse(LS.get('dbxDirty')||'[]')}catch(e){return[]}})());
function markDirty(pid){dirty.add(pid);LS.set('dbxDirty',JSON.stringify([...dirty]));soon()}
let syncing=false,pending=0,syncErr='',sT;
const soon=()=>{clearTimeout(sT);sT=setTimeout(sync,1500)};
async function countPending(){try{pending=await req(os('queue').count())}catch(e){}syncUi()}
async function writeJson(pid){const p=await get('projects',pid);if(!p)return;const rs=(await byIdx('records','pid',pid)).sort((a,b)=>a.created-b.created),out=[];
  for(const r of rs){const ph=(await byIdx('photos','rid',r.id)).sort((a,b)=>a.ts-b.ts),pt=r.pt!=null?p.pts[r.pt]:null;
    const t=typ(r),itm=xy=>({y:+xy[1].toFixed(3),x:+xy[0].toFixed(3)});
    out.push({type:{mh:'שוחה',el:'אלמנט',line:'קו',flow:'זרימה'}[t],element:t==='mh'?'שוחה':t==='flow'?null:r.el,name:r.name,point:pt?pt.name:null,survey_code:pt?pt.code:null,lid_level:pt&&pt.h&&t==='mh'?pt.h:null,infra:r.infra?IC[r.infra][1]:null,itm:itm(r.xy),wgs84:{lat:r.ll[1],lon:r.ll[0]},
      vertices:t==='line'?r.pts.map(v=>({itm:itm(v.xy),depth:v.d,on:v.on||null,branch_of:v.ref&&v.ref.line?(recs.get(v.ref.line)||{}).name||v.ref.line:null})):undefined,
      from:t==='flow'?{name:r.a.name,itm:itm(r.a.xy)}:undefined,to:t==='flow'?{name:r.b.name,itm:itm(r.b.xy)}:undefined,
      created:new Date(r.created).toISOString(),updated:new Date(r.updated||r.created).toISOString(),details:r.details||null,
      photos:ph.map(x=>({file:x.path?x.path.split('/').pop():null,uploaded:!!x.up,heading_true_north:x.hd,north_up:!!x.north,taken:new Date(x.ts).toISOString()}))})}
  const j={app:'שוחות',version:1,project:{name:p.name,plan:p.plan||null,dwg:p.file||null},updated:new Date().toISOString(),records:out};
  await dbxPut(`${await projFolder(p)}/שוחות.json`,new Blob([JSON.stringify(j,null,1)],{type:'application/json'}))}
async function sync(){if(syncing||!DBX.refresh())return syncUi();if(!navigator.onLine){syncErr='אין אינטרנט';return countPending()}syncing=true;syncErr='';syncUi();
  try{const ids=await req(os('queue').getAllKeys());pending=ids.length;
    for(const id of ids){const ph=await get('photos',id),r=ph&&await get('records',ph.rid),p=r&&await get('projects',r.pid);
      if(!ph||!ph.blob||!r||!p){await del('queue',id);pending--;continue}
      if(!ph.no){ph.no=await nextNo(r);await put('photos',ph)}
      const res=await dbxUpload(`${await projFolder(p)}/תמונות/${safe(r.name)}_${ph.no}.jpg`,ph.blob);
      ph.path=res.path_display;ph.up=Date.now();delete ph.blob;await put('photos',ph);await del('queue',id);pending--;dirty.add(p.id);syncUi()}
    for(const pid of[...dirty]){await writeJson(pid);dirty.delete(pid);LS.set('dbxDirty',JSON.stringify([...dirty]))}}
  catch(e){console.error(e);syncErr=e.message==='nolink'?'':navigator.onLine?'שגיאת סנכרון – ננסה שוב':'אין אינטרנט'}
  finally{syncing=false;LS.set('dbxDirty',JSON.stringify([...dirty]));await countPending()}}
function syncUi(){const on=!!DBX.refresh(),b=$('#bSync');let cls='off',txt;
  if(!on)txt='לא מחובר';else if(syncing){cls='busy';txt=`מעלה… ${pending} נותרו`}else if(pending){cls='wait';txt=(syncErr||'ממתין')+` · ${pending} תמונות`}else if(syncErr){cls='wait';txt=syncErr}else{cls='ok';txt='הכל גובה בדרופבוקס'}
  b.className=cls;b.title=txt;$('#sBadge').hidden=!pending;$('#sBadge').textContent=pending;
  $('#dbxStat').textContent=on?txt:'לא מחובר – התמונות נשמרות רק בטלפון';$('#dbxSetup').hidden=on;$('#dbxOn').hidden=!on;if(!$('#dbxKey').value)$('#dbxKey').value=DBX.key()}
$('#bSync').onclick=()=>{if(!DBX.refresh()){toast('צריך להתחבר לדרופבוקס (במסך הפרויקטים)');return}toast($('#bSync').title);sync()};
$('#dbxGo').onclick=async()=>{const k=$('#dbxKey').value.trim();if(!k)return toast('הדבק את ה-App key');LS.set('dbxKey',k);if(STANDALONE)return $('#dbxPaste').onclick();location.href=await dbxAuthUrl(true)};
$('#dbxPaste').onclick=async()=>{const k=$('#dbxKey').value.trim();if(!k)return toast('הדבק קודם את ה-App key');LS.set('dbxKey',k);$('#dbxCodeBox').hidden=false;toast('אשר בדרופבוקס, העתק את הקוד וחזור לכאן');const u=await dbxAuthUrl(false);const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
$('#dbxCodeGo').onclick=async()=>{try{await dbxExchange($('#dbxCode').value,false);$('#dbxCodeBox').hidden=true;toast('מחובר לדרופבוקס');markAllDirty();sync()}catch(e){toast('החיבור נכשל: '+e.message)}};
$('#dbxNow').onclick=()=>{markAllDirty();sync()};
$('#dbxOff').onclick=()=>arm($('#dbxOff'),'לחץ שוב לניתוק',()=>{['dbxRefresh','dbxAccess','dbxExp'].forEach(k=>LS.set(k,''));syncUi()});
async function markAllDirty(){for(const p of await all('projects'))if((await byIdx('records','pid',p.id)).length)dirty.add(p.id);LS.set('dbxDirty',JSON.stringify([...dirty]))}
async function dbxReturn(){const q=new URLSearchParams(location.search);if(!q.has('code')&&!q.has('error'))return;history.replaceState(null,'',REDIR);
  if(q.get('error')){toast('החיבור לדרופבוקס בוטל');return}try{await dbxExchange(q.get('code'),true);toast('מחובר לדרופבוקס ✓');await markAllDirty()}catch(e){toast('החיבור נכשל: '+e.message)}}
addEventListener('online',()=>sync());document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});setInterval(()=>{if(pending||dirty.size)sync()},60000);

/* ---------- running in a browser instead of the home-screen app ---------- */
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
if(!STANDALONE&&/iPhone|iPad|Android/i.test(navigator.userAgent)){const br=/CriOS/.test(navigator.userAgent)?'בכרום':/FxiOS/.test(navigator.userAgent)?'בפיירפוקס':'בספארי';
  document.querySelectorAll('#home header,#mapv header').forEach(h=>h.insertAdjacentHTML('afterend',`<div class="brw"><span>⚠️ פתוח ${br} ולא באפליקציה – מה שתצלם כאן לא יופיע באפליקציה שבמסך הבית</span><button aria-label="הסתר" onclick="this.parentNode.remove()">×</button></div>`))}
/* ---------- start ---------- */
(async()=>{try{await openDb()}catch(e){document.body.innerHTML='<p style="padding:30px">האחסון בדפדפן לא זמין (מצב פרטי?)</p>';return}
  if(!(await get('projects','demo-4087-25')))await put('projects',{id:'demo-4087-25',name:'תוכנית '+DEMO.plan+' (דוגמה)',plan:DEMO.plan,created:1,lines:DEMO.lines,pts:DEMO.pts,ref:DEMO.ref});
  $('#snapCb').checked=!!vis.snap;modeUi();await dbxReturn();syncUi();countPending();sync();
  const last=LS.get('last');if(last&&await get('projects',last))openProject(last);else home()})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
